name: Build Kang Connect APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS project folders
        run: flutter create --platforms=android,ios --project-name kang_connect .
      - name: Install packages
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kang-connect-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
